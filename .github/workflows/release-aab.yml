name: Release AAB (Play Store)

on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - packages/shared/**
      - .github/workflows/release-aab.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (auto-detected from app.json if left empty)
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark as pre-release?
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean
        working-directory: mobile

      - name: Build Android AAB (Play Store bundle)
        run: cd mobile/android && ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-release
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
